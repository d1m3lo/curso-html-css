<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplos de formulário</h1>
    <form action="teste.html" method="post" autocomplete="off">

<p>
    <label for="icor">Cor: </label>
    <input type="color" name="cor" id="icor" value="#0008ff">
</p>

<p>
    <label for="inivel">Nível de Satisfação</label>
    <input type="range" name="nivel" id="inivel" min="1" max="5" value="1">
</p>

<p>
    <label for="ifoto">Foto de Perfil: </label>
    <input type="file" name="foto" id="ifoto">
</p>


<p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</p>



    </form>
</body>
</html>
