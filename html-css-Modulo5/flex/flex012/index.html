<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            margin: 10px;
            display: flex;
            flex-flow: row nowrap;

        }

        div.conteiner2 {
            background-color: crimson;
            margin: 10px;
            display: flex;
            flex-flow: row nowrap;

        }

        div.conteiner3 {
            background-color: gold;
            margin: 10px;
            display: flex;
            flex-flow: row nowrap;

        }

        div.conteiner4 {
            background-color: blueviolet;
            margin: 10px;
            display: flex;
            flex-flow: row nowrap;

        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;


        }

        div.item2 {
            background-color: chocolate;
            border: 1px solid black;
            text-align: center;


        }

        div.item3 {
            background-color: lightyellow;
            border: 1px solid black;
            text-align: center;


        }

        div.item4 {
            background-color: plum;
            border: 1px solid black;
            text-align: center;


        }

        div#cxA {
            /*
            flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px; 

            flex = flex-grow + flex-shrink + flex-basis

            */

           flex: initial;
        }

        div#cxB {
            /*
            flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px;
            */

            flex:none;


        }

        div#cxC {
            /*
            flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto;
            */

            flex: auto;
        }
        div#cxD {
            /*
            flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto;
            */

            flex: 3;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        <div class="item" id="cxD">D</div>


    </div>

</body>

</html>
